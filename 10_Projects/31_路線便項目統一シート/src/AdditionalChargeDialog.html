<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: "Meiryo", sans-serif; padding: 20px; color: #333; }
      .form-group { margin-bottom: 15px; }
      label { display: block; font-weight: bold; margin-bottom: 5px; }
      input[type="text"], input[type="number"], select {
        width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
      }
      .readonly { background-color: #f5f5f5; color: #666; }
      .warning-box {
        background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;
        padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none;
      }
      .btn-container { text-align: center; margin-top: 20px; }
      button {
        padding: 10px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer;
      }
      .btn-submit { background-color: #1a73e8; color: white; }
      .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
      .btn-cancel { background-color: #fff; color: #333; border: 1px solid #ccc; margin-left: 10px; }
      .hint { font-size: 12px; color: #666; margin-top: 4px; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
  </head>
  <body>

    <div id="warningBox" class="warning-box">
      <strong>注意:</strong> この契約プロファイルは期間合計料金（PERIOD_SEPARATE）の設定ではありません。<br>
      登録を継続できません。
    </div>

    <form id="chargeForm">
      <div class="form-group">
        <label for="profileId">契約プロファイル <span style="color:red">*</span></label>
        <select id="profileId" name="profileId" required onchange="onProfileChange()">
          <option value="">選択してください...</option>
        </select>
      </div>

      <div class="form-group grid-2">
        <div>
          <label>路線便会社</label>
          <input type="text" id="carrierName" class="readonly" readonly>
          <input type="hidden" id="carrierCode" name="carrierCode">
        </div>
        <div>
          <label>荷主・契約識別情報</label>
          <input type="text" id="identifier" class="readonly" readonly>
        </div>
      </div>
      
      <div class="form-group">
        <label>サーチャージ取扱区分</label>
        <input type="text" id="handling" class="readonly" readonly>
      </div>

      <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">

      <div class="form-group">
        <label for="targetMonth">対象年月 (YYYY-MM) <span style="color:red">*</span></label>
        <input type="text" id="targetMonth" name="targetMonth" placeholder="例: 2026-07" required pattern="\d{4}-\d{2}">
      </div>

      <div class="form-group grid-2">
        <div>
          <label for="startDate">対象開始日</label>
          <input type="text" id="startDate" name="startDate" placeholder="例: 2026-07-01">
        </div>
        <div>
          <label for="endDate">対象終了日</label>
          <input type="text" id="endDate" name="endDate" placeholder="例: 2026-07-31">
        </div>
      </div>

      <div class="form-group">
        <label for="chargeType">料金種別 <span style="color:red">*</span></label>
        <select id="chargeType" name="chargeType" required onchange="toggleOtherChargeType()">
          <option value="燃料サーチャージ">燃料サーチャージ</option>
          <option value="繁忙期割増">繁忙期割増</option>
          <option value="最低料金調整">最低料金調整</option>
          <option value="特別取扱料金">特別取扱料金</option>
          <option value="その他">その他（自由入力）</option>
        </select>
        <input type="text" id="chargeTypeOther" name="chargeTypeOther" placeholder="種別名を入力" style="display:none; margin-top:5px;">
      </div>
      
      <div class="form-group">
        <label for="originalItemName">元項目名</label>
        <input type="text" id="originalItemName" name="originalItemName" placeholder="請求書上の名目など">
      </div>

      <div class="form-group">
        <label for="amount">金額 <span style="color:red">*</span></label>
        <input type="text" id="amount" name="amount" placeholder="例: 85000 または 85,000円" required onblur="validateAmount()">
        <div id="amountHint" class="hint">0や負数も入力可能です。</div>
      </div>
      
      <div class="form-group">
        <label for="aggregateUnit">集計単位</label>
        <select id="aggregateUnit" name="aggregateUnit">
          <option value="月次">月次</option>
          <option value="旬">旬（10日）</option>
          <option value="週次">週次</option>
          <option value="一括">一括</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="note">備考</label>
        <input type="text" id="note" name="note">
      </div>

      <div class="btn-container">
        <button type="button" class="btn-submit" id="btnSubmit" onclick="submitForm()">登録</button>
        <button type="button" class="btn-cancel" onclick="google.script.host.close()">キャンセル</button>
      </div>
    </form>

    <script>
      let profilesData = [];

      window.onload = function() {
        google.script.run
          .withSuccessHandler(function(profiles) {
            profilesData = profiles;
            const select = document.getElementById("profileId");
            profiles.forEach(function(p) {
              const opt = document.createElement("option");
              opt.value = p.id;
              opt.textContent = p.name;
              select.appendChild(opt);
            });
          })
          .withFailureHandler(function(error) {
            alert("契約プロファイルの取得に失敗しました。\n詳細: " + (error.message || error));
          })
          .apiGetValidContractProfiles();
      };

      function onProfileChange() {
        const id = document.getElementById("profileId").value;
        const p = profilesData.find(x => x.id === id);
        
        const warning = document.getElementById("warningBox");
        const btn = document.getElementById("btnSubmit");
        
        if (p) {
          document.getElementById("carrierName").value = p.carrierName;
          document.getElementById("carrierCode").value = p.carrierCode;
          document.getElementById("identifier").value = p.identifier;
          document.getElementById("handling").value = p.handling;
          
          if (p.handling !== "PERIOD_SEPARATE") {
            warning.style.display = "block";
            btn.disabled = true;
          } else {
            warning.style.display = "none";
            btn.disabled = false;
          }
        } else {
          document.getElementById("carrierName").value = "";
          document.getElementById("carrierCode").value = "";
          document.getElementById("identifier").value = "";
          document.getElementById("handling").value = "";
          warning.style.display = "none";
          btn.disabled = false;
        }
      }
      
      function toggleOtherChargeType() {
        const type = document.getElementById("chargeType").value;
        const other = document.getElementById("chargeTypeOther");
        if (type === "その他") {
          other.style.display = "block";
          other.required = true;
        } else {
          other.style.display = "none";
          other.required = false;
        }
      }
      
      function validateAmount() {
        const raw = document.getElementById("amount").value.trim();
        const hint = document.getElementById("amountHint");
        
        if (!raw) {
          hint.style.color = "red";
          hint.textContent = "金額を入力してください。";
          return false;
        }
        
        // 数値変換処理 (Phase3-3と統一)
        const cleaned = raw.replace(/,/g, '').replace(/円/g, '').replace(/\\/g, '').trim();
        const num = Number(cleaned);
        
        if (isNaN(num) || cleaned === "") {
          hint.style.color = "red";
          hint.textContent = "数値として解釈できません。";
          return false;
        } else {
          hint.style.color = "green";
          hint.textContent = "解釈後: " + num + " 円";
          return true;
        }
      }

      function submitForm() {
        // 個別バリデーション
        const profileId = document.getElementById("profileId").value;
        if (!profileId) {
          alert("契約プロファイルを選択してください。");
          return;
        }
        
        const targetMonth = document.getElementById("targetMonth").value;
        if (!targetMonth) {
          alert("対象年月を入力してください。");
          return;
        }
        
        const monthPattern = /^\d{4}-\d{2}$/;
        if (!monthPattern.test(targetMonth)) {
          alert("対象年月は YYYY-MM の形式で入力してください。");
          return;
        }

        const chargeType = document.getElementById("chargeType").value;
        if (!chargeType) {
          alert("料金種別を選択してください。");
          return;
        }
        if (chargeType === "その他") {
          const other = document.getElementById("chargeTypeOther").value.trim();
          if (!other) {
            alert("料金種別（その他）を入力してください。");
            return;
          }
        }
        
        const rawAmount = document.getElementById("amount").value.trim();
        if (!rawAmount) {
          alert("金額を入力してください。");
          return;
        }
        
        if (!validateAmount()) {
          alert("金額を数値として読み取れません。");
          return;
        }
        
        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.textContent = "登録中...";
        
        const chargeTypeVal = document.getElementById("chargeType").value;
        const actualChargeType = chargeTypeVal === "その他" ? document.getElementById("chargeTypeOther").value.trim() : chargeTypeVal;
        
        const payload = {
          profileId: document.getElementById("profileId").value,
          targetMonth: document.getElementById("targetMonth").value,
          startDate: document.getElementById("startDate").value,
          endDate: document.getElementById("endDate").value,
          chargeType: actualChargeType,
          originalItemName: document.getElementById("originalItemName").value,
          amount: document.getElementById("amount").value,
          aggregateUnit: document.getElementById("aggregateUnit").value,
          note: document.getElementById("note").value
        };

        google.script.run
          .withSuccessHandler(function(response) {
            btn.disabled = false;
            btn.textContent = "登録";
            if (response.success) {
              alert(response.message + (response.newId ? "\nID: " + response.newId : ""));
              google.script.host.close();
            } else {
              alert("保存に失敗しました:\n" + response.message);
            }
          })
          .withFailureHandler(function(error) {
            btn.disabled = false;
            btn.textContent = "登録";
            alert("通信エラーが発生しました:\n" + (error.message || error));
          })
          .apiSaveAdditionalCharge(payload);
      }
    </script>
  </body>
</html>
