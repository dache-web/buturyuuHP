<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>路線便データ取込（既存シート）</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 15px;
      color: #333;
      background-color: #f8f9fa;
      font-size: 14px;
    }
    h2 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 15px;
      color: #1a202c;
      border-bottom: 2px solid #3182ce;
      padding-bottom: 6px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #2d3748;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-size: 14px;
      background-color: #fff;
    }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #3182ce;
      color: #fff;
    }
    .btn-primary:hover {
      background-color: #2b6cb0;
    }
    .btn-primary:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: #718096;
      color: #fff;
    }
    .step {
      display: none;
    }
    .step.active {
      display: block;
    }
    #loading {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3182ce;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .alert-box {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    table.mapping-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    table.mapping-table th, table.mapping-table td {
      border: 1px solid #e2e8f0;
      padding: 6px 8px;
      text-align: left;
    }
    table.mapping-table th {
      background-color: #edf2f7;
    }
    .confidence-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .conf-prev { background: #d4edda; color: #155724; }
    .conf-high { background: #cce5ff; color: #004085; }
    .conf-mid { background: #fff3cd; color: #856404; }
    .conf-low { background: #f8d7da; color: #721c24; }
    .conf-none { background: #e2e3e5; color: #383d41; }
    .join-settings {
      display: none;
      margin-top: 4px;
      padding: 4px;
      background: #f7fafc;
      border: 1px dashed #cbd5e0;
    }
    .mapping-error-row {
      background-color: #fff5f5 !important;
      border: 2px solid #e53e3e !important;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p id="loading-msg" style="margin-top:10px;">処理中...</p>
</div>

<h2>路線便データ取込（既存シート）</h2>

<!-- Step 1: 既存シート選択専用入口 -->
<div id="step-1" class="step active">
  <form id="existingSheetForm" onsubmit="return false;">
    <div class="form-group">
      <label for="companyCode">1. 対象路線便会社</label>
      <select id="companyCode" name="companyCode" required>
        <option value="">-- 会社を選択してください --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="existingSheetSelect">2. 使用する原本シート</label>
      <select id="existingSheetSelect" required>
        <option value="">-- シートを選択してください --</option>
      </select>
    </div>

    <div class="form-group" style="margin-top: 20px;">
      <button type="button" id="btnStartImport" class="btn btn-primary" onclick="startSheetImport()">このシートを読み取る</button>
    </div>
  </form>
</div>

<!-- Step 2: マッピング＆設定 -->
<div id="step-2" class="step">
  <div id="mapping-alert" class="alert-box"></div>
  
  <div class="form-group" style="background:#edf2f7; padding:10px; border-radius:4px;">
    <strong>原本シート：</strong><span id="targetFileName"></span><br>
    <strong>対象会社：</strong><span id="targetCompanyName"></span>
  </div>

  <!-- 契約プロファイル設定 -->
  <div class="form-group" id="contractProfileGroup">
    <label for="contractProfileSelect">契約プロファイル選択：</label>
    <select id="contractProfileSelect" onchange="onContractProfileChange()">
      <option value="">-- 新規作成 または 未設定 --</option>
    </select>
    <div id="newContractProfileGroup" style="display:none; margin-top:8px; background:#fff; padding:10px; border:1px solid #cbd5e0; border-radius:4px;">
      <div style="margin-bottom:8px;">
        <label for="newContractProfileName" style="font-size:0.85rem;">新規契約プロファイル名：</label>
        <input type="text" id="newContractProfileName" placeholder="例: 路線便A社 2026年度運賃契約">
      </div>
      <div>
        <label for="newContractIdentifier" style="font-size:0.85rem;">荷主・契約識別情報：</label>
        <input type="text" id="newContractIdentifier" placeholder="例: 埼玉センター発着契約">
      </div>
    </div>
  </div>

  <!-- サーチャージ取扱区分設定 -->
  <div class="form-group">
    <label for="surchargeHandling">サーチャージ取扱区分：</label>
    <select id="surchargeHandling">
      <option value="UNCONFIRMED">未設定／要確認</option>
      <option value="NONE">なし</option>
      <option value="INCLUDED">実績運賃に内包</option>
      <option value="ADDED">標準化時に実績運賃へ加算</option>
      <option value="DETAIL_SEPARATE">明細別料金</option>
      <option value="PERIOD_SEPARATE">期間合計料金</option>
    </select>
  </div>

  <!-- 【実績運賃の作り方】 -->
  <div class="form-group" style="background:#fff; padding:12px; border:1px solid #cbd5e0; border-radius:4px; margin-top:15px;">
    <label style="color:#2b6cb0; font-size:0.95rem; margin-bottom:8px;">【実績運賃の作り方】</label>
    <div style="display:flex; gap:20px; align-items:center; margin-bottom:10px;">
      <label style="font-weight:normal; cursor:pointer;">
        <input type="radio" name="calcMethod" id="calcMethod_direct" value="直接取得" checked onchange="toggleCalcSettings()"> 元データの実績運賃をそのまま使う
      </label>
      <label style="font-weight:normal; cursor:pointer;">
        <input type="radio" name="calcMethod" id="calcMethod_calc" value="計算" onchange="toggleCalcSettings()"> 複数項目を計算して作る
      </label>
    </div>
    
    <div id="calc-settings-area" style="display:none; padding:10px; background:#f7fafc; border:1px dashed #cbd5e0; border-radius:4px;">
      <p style="margin:0 0 8px 0; font-size:0.85rem; color:#4a5568;">※マッピングした計算項目に対して、加算（＋）か減算（－）かを指定してください。</p>
      <div id="calc-items-list" style="margin-bottom:10px;"></div>
      
      <div style="background:#ebf8ff; padding:8px 12px; border-radius:4px; font-size:0.85rem; color:#2b6cb0;">
        <strong>【計算プレビュー】（サンプル上位）</strong>
        <div id="calc-preview-container" style="margin-top:4px;">計算項目が選択されていません。</div>
      </div>
    </div>
  </div>

  <div style="margin-top: 15px; margin-bottom: 10px;">
    <label>項目マッピング設定：</label>
  </div>

  <div style="overflow-x: auto;">
    <table class="mapping-table">
      <thead>
        <tr>
          <th>取込元ヘッダー</th>
          <th>サンプルデータ</th>
          <th>統一項目マッピング</th>
          <th>判定</th>
        </tr>
      </thead>
      <tbody id="mapping-body"></tbody>
    </table>
  </div>

  <div id="mapping-validation-warning" style="color:#e53e3e; margin-top:10px; display:none;"></div>

  <div class="form-group" style="margin-top: 15px; display:flex; gap:10px;">
    <button type="button" id="btn-confirm-mapping" class="btn btn-primary" onclick="confirmMapping()">確定して標準化を実行</button>
    <button type="button" class="btn btn-secondary" onclick="backToStep1()">戻る</button>
  </div>
</div>

<!-- Step 3: 処理完了結果 -->
<div id="step-3" class="step">
  <div style="background:#fff; padding:15px; border:1px solid #cbd5e0; border-radius:4px; margin-bottom:15px;">
    <h3 style="margin-top:0; color:#2b6cb0; font-size:1.1rem; border-bottom:1px solid #e2e8f0; padding-bottom:6px;">3. 処理完了結果</h3>
    <p id="result-message" style="font-size:0.95rem; font-weight:bold; white-space:pre-wrap; color:#2d3748; line-height:1.6;"></p>
  </div>
  
  <div id="error-details-container" style="display:none; margin-top:10px; background:#fff5f5; padding:10px; border:1px solid #feb2b2; border-radius:4px;">
    <strong style="color:#c53030; font-size:0.9rem;">エラー詳細：</strong>
    <pre id="error-details-text" style="margin-top:6px; font-size:0.85rem; white-space:pre-wrap; color:#742a2a; max-height:150px; overflow-y:auto;"></pre>
  </div>

  <div id="csv-disabled-notice" style="display:none; margin-top:12px; color:#e53e3e; font-size:0.85rem; font-weight:bold;">
    ※エラーを修正するとCSVを出力できます。
  </div>
  
  <div style="margin-top:15px; display:flex; gap:10px; align-items:center;">
    <button type="button" id="btn-download-csv" class="btn btn-primary" onclick="downloadCsv()">標準化CSVを出力（UTF-8 BOM付）</button>
    <button type="button" class="btn btn-secondary" onclick="goToStep(2)">マッピング修正に戻る</button>
    <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">閉じる</button>
  </div>
</div>

<script>
  let serverData = {};
  let currentSession = {};
  let calcOperators = {};

  window.onload = function() {
    showLoading("初期データ取得中...");
    google.script.run
      .withSuccessHandler(res => {
        serverData = res;
        const sel = document.getElementById('companyCode');
        sel.innerHTML = '<option value="">-- 会社を選択してください --</option>';
        if (res.carriers && res.carriers.length > 0) {
          res.carriers.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.code;
            opt.textContent = c.name + " (" + c.code + ")";
            sel.appendChild(opt);
          });
        }

        const sheetSel = document.getElementById('existingSheetSelect');
        if (sheetSel) {
          sheetSel.innerHTML = '<option value="">-- シートを選択してください --</option>';
          if (res.existingSheets && res.existingSheets.length > 0) {
            res.existingSheets.forEach(s => {
              const opt = document.createElement('option');
              opt.value = s.sheetName;
              opt.textContent = s.sheetName;
              sheetSel.appendChild(opt);
            });
          }
        }
        hideLoading();
      })
      .withFailureHandler(err => {
        hideLoading();
        alert("初期データの取得に失敗しました: " + err.message);
      })
      .apiGetInitialData();
  };

  function showLoading(msg) {
    document.getElementById('loading-msg').textContent = msg || "処理中...";
    document.getElementById('loading').style.display = 'flex';
  }
  function hideLoading() {
    document.getElementById('loading').style.display = 'none';
  }

  function startSheetImport() {
    const companyCode = document.getElementById('companyCode').value;
    const sheetName = document.getElementById('existingSheetSelect').value;

    if (!companyCode) {
      alert("対象路線便会社を選択してください。");
      return;
    }
    if (!sheetName) {
      alert("使用する原本シートを選択してください。");
      return;
    }

    showLoading("シート解析中...");
    google.script.run
      .withSuccessHandler(onSheetImportSuccess)
      .withFailureHandler(err => {
        hideLoading();
        alert("解析エラー: " + err.message);
      })
      .apiProcessExistingSheet(sheetName, companyCode);
  }

  function onSheetImportSuccess(res) {
    hideLoading();
    if (!res || !res.success) {
      alert("解析エラー: " + (res ? res.message : "レスポンスが不正です"));
      return;
    }

    const companyCode = document.getElementById('companyCode').value;
    currentSession = res;
    currentSession.companyCode = companyCode;

    document.getElementById('targetFileName').textContent = res.fileName || document.getElementById('existingSheetSelect').value;
    
    const selComp = document.getElementById('companyCode');
    const selectedOpt = selComp.options[selComp.selectedIndex];
    document.getElementById('targetCompanyName').textContent = selectedOpt ? selectedOpt.textContent : companyCode;

    if (res.calcMethod === "計算") {
      document.getElementById('calcMethod_calc').checked = true;
    } else {
      document.getElementById('calcMethod_direct').checked = true;
    }

    if (res.calcRule) {
      try {
        const ruleArr = typeof res.calcRule === "string" ? JSON.parse(res.calcRule) : res.calcRule;
        if (ruleArr && ruleArr.fields) {
          ruleArr.fields.forEach(f => {
            calcOperators[f.sourceIndex] = f.operator;
          });
        }
      } catch(e) {}
    }

    const cpSelect = document.getElementById('contractProfileSelect');
    if (cpSelect) {
      cpSelect.innerHTML = '<option value="">-- 新規作成 または 未設定 --</option>';
      if (res.contractProfiles && res.contractProfiles.length > 0) {
        res.contractProfiles.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name ? p.name : p.identifier;
          opt.dataset.surcharge = p.surchargeHandling;
          cpSelect.appendChild(opt);
        });
      }
      if (res.defaultProfileId) {
        cpSelect.value = res.defaultProfileId;
      }
      const sHandling = document.getElementById('surchargeHandling');
      if (sHandling) sHandling.value = res.defaultSurchargeHandling || "UNCONFIRMED";
    }

    renderMappingTable(res.predictions, res.sampleData);
    toggleCalcSettings();
    onContractProfileChange();
    goToStep(2);

    if (res.isExactMatch) {
      const alertBox = document.getElementById('mapping-alert');
      alertBox.className = "alert-box alert-success";
      alertBox.style.backgroundColor = "#e6fffa";
      alertBox.style.color = "#234e52";
      alertBox.style.border = "1px solid #b2f5ea";
      alertBox.textContent = "前回の確定マッピングと完全に一致しました。内容を確認し「確定して標準化を実行」を押してください。";
      alertBox.style.display = "block";
    } else {
      const alertBox = document.getElementById('mapping-alert');
      alertBox.className = "alert-box alert-warning";
      alertBox.style.backgroundColor = "#fffaf0";
      alertBox.style.color = "#744210";
      alertBox.style.border = "1px solid #fbd38d";
      alertBox.textContent = "自動予測結果を表示しています。未設定項目や紐付け内容を確認・修正してください。";
      alertBox.style.display = "block";
    }
  }

  function goToStep(stepNumber) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step-' + stepNumber).classList.add('active');
  }

  function backToStep1() {
    goToStep(1);
  }

  function onContractProfileChange() {
    const cpSelect = document.getElementById('contractProfileSelect');
    const newGroup = document.getElementById('newContractProfileGroup');
    const surchargeSel = document.getElementById('surchargeHandling');
    
    if (cpSelect.value === "") {
      newGroup.style.display = "block";
      surchargeSel.value = "UNCONFIRMED";
    } else {
      newGroup.style.display = "none";
      const selectedOpt = cpSelect.options[cpSelect.selectedIndex];
      if (selectedOpt && selectedOpt.dataset.surcharge) {
        surchargeSel.value = selectedOpt.dataset.surcharge;
      }
    }
  }

  function toggleCalcSettings() {
    const isCalc = document.getElementById('calcMethod_calc').checked;
    const area = document.getElementById('calc-settings-area');
    if (area) {
      area.style.display = isCalc ? 'block' : 'none';
      if (isCalc) renderCalcItemsList();
    }
  }

  function renderCalcItemsList() {
    const container = document.getElementById('calc-items-list');
    if (!container) return;
    container.innerHTML = '';
    
    const calcRows = [];
    const selects = document.querySelectorAll('.common-field-select');
    
    selects.forEach(sel => {
      const val = sel.value;
      const calcFields = ["基本運賃", "中継料", "燃料サーチャージ", "その他加算料金", "値引額", "その他運賃関連項目"];
      if (calcFields.includes(val)) {
        const origIdx = sel.dataset.originalIndex;
        const origName = sel.dataset.originalName;
        calcRows.push({ originalIndex: origIdx, originalName: origName, commonField: val });
      }
    });

    if (calcRows.length === 0) {
      container.innerHTML = '<span style="font-size:0.85rem; color:#e53e3e;">※マッピングで「基本運賃」「中継料」等の運賃計算項目が選択されていません。</span>';
      updateCalcPreview([]);
      return;
    }

    calcRows.forEach(item => {
      const div = document.createElement('div');
      div.style.display = 'flex';
      div.style.alignItems = 'center';
      div.style.gap = '10px';
      div.style.marginBottom = '6px';

      const currentOp = calcOperators[item.originalIndex] || (item.commonField === "値引額" ? "-" : "+");
      calcOperators[item.originalIndex] = currentOp;

      div.innerHTML = `
        <span style="font-weight:bold; font-size:0.85rem; min-width:140px;">${item.commonField} (${item.originalName}):</span>
        <select onchange="onOperatorChange(${item.originalIndex}, this.value)" style="width:auto; padding:2px 6px;">
          <option value="+" ${currentOp === '+' ? 'selected' : ''}>＋ (加算)</option>
          <option value="-" ${currentOp === '-' ? 'selected' : ''}>－ (減算)</option>
        </select>
      `;
      container.appendChild(div);
    });

    updateCalcPreview(calcRows);
  }

  function onOperatorChange(origIdx, opVal) {
    calcOperators[origIdx] = opVal;
    renderCalcItemsList();
  }

  function updateCalcPreview(calcRows) {
    const previewContainer = document.getElementById('calc-preview-container');
    if (!previewContainer) return;
    
    if (!currentSession || !currentSession.sampleData || calcRows.length === 0) {
      previewContainer.textContent = "計算対象の項目が設定されていません。";
      return;
    }

    const calcRuleArray = calcRows.map(r => ({
      sourceIndex: Number(r.originalIndex),
      operator: calcOperators[r.originalIndex] || "+"
    }));

    google.script.run
      .withSuccessHandler(previewValues => {
        if (previewValues && previewValues.length > 0) {
          previewContainer.innerHTML = previewValues.map((v, i) => `サンプル${i+1}: <strong>${v}円</strong>`).join(" / ");
        } else {
          previewContainer.textContent = "プレビュー不可";
        }
      })
      .apiPreviewCalcFreight(currentSession.sampleData, calcRuleArray);
  }

  function checkMultiSelect() {
    const selects = document.querySelectorAll('.common-field-select');
    const counts = {};
    
    selects.forEach(sel => {
      const val = sel.value;
      if (val && val !== "未使用" && val !== "-- 未選択 --") {
        counts[val] = (counts[val] || 0) + 1;
      }
    });

    selects.forEach(sel => {
      const idx = sel.dataset.originalIndex;
      const val = sel.value;
      const joinDiv = document.getElementById(`join_${idx}`);
      
      if (joinDiv) {
        if (val && val !== "未使用" && val !== "-- 未選択 --" && val !== "実績運賃" && counts[val] > 1) {
          joinDiv.style.display = "block";
        } else {
          joinDiv.style.display = "none";
        }
      }
    });
  }

  function renderMappingTable(predictions, sampleData) {
    const tbody = document.getElementById('mapping-body');
    tbody.innerHTML = '';
    
    const commonFields = serverData.commonFields || [];

    predictions.forEach((pred, index) => {
      const tr = document.createElement('tr');
      
      const tdOrig = document.createElement('td');
      tdOrig.textContent = pred.originalName;
      tr.appendChild(tdOrig);

      const tdSample = document.createElement('td');
      let sampleVal = "";
      if (sampleData && sampleData.length > 0 && sampleData[0][index] !== undefined) {
        sampleVal = sampleData[0][index];
      }
      tdSample.textContent = sampleVal;
      tdSample.style.color = "#718096";
      tr.appendChild(tdSample);

      const tdSelect = document.createElement('td');
      const select = document.createElement('select');
      select.className = "common-field-select";
      select.dataset.originalIndex = index;
      select.dataset.originalName = pred.originalName;
      select.onchange = function() {
        checkMultiSelect();
        validateRequiredFields();
        if (document.getElementById('calcMethod_calc').checked) {
          renderCalcItemsList();
        }
      };

      commonFields.forEach(field => {
        const opt = document.createElement('option');
        opt.value = field;
        opt.textContent = field;
        if (field === pred.commonField) opt.selected = true;
        select.appendChild(opt);
      });
      tdSelect.appendChild(select);

      // 結合設定UIの追加
      const joinDiv = document.createElement('div');
      joinDiv.className = "join-settings";
      joinDiv.id = `join_${index}`;
      joinDiv.style.display = "none";
      joinDiv.innerHTML = `
        <label style="font-size:0.75rem; color:#4a5568; display:block; margin-top:4px; margin-bottom:2px;">※複数項目が同一標準項目へ指定されています。結合順と方法を指定してください。</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <span style="font-size:0.8rem;">順序:</span>
          <input type="number" id="joinOrder_${index}" value="${pred.joinOrder || (index + 1)}" style="width:50px; padding:2px 4px; font-size:0.8rem;" title="結合順序">
          <span style="font-size:0.8rem;">方法:</span>
          <select id="joinMethod_${index}" style="width:auto; padding:2px 4px; font-size:0.8rem;">
            <option value="半角スペース" ${(!pred.joinMethod || pred.joinMethod === "半角スペース") ? "selected" : ""}>半角スペース</option>
            <option value="全角スペース" ${pred.joinMethod === "全角スペース" ? "selected" : ""}>全角スペース</option>
            <option value="区切りなし" ${pred.joinMethod === "区切りなし" ? "selected" : ""}>区切りなし</option>
          </select>
        </div>
      `;
      tdSelect.appendChild(joinDiv);

      tr.appendChild(tdSelect);

      const tdConf = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = "confidence-badge ";
      if (pred.confidence === "前回確定") badge.className += "conf-prev";
      else if (pred.confidence === "高") badge.className += "conf-high";
      else if (pred.confidence === "中") badge.className += "conf-mid";
      else if (pred.confidence === "低") badge.className += "conf-low";
      else badge.className += "conf-none";
      
      badge.textContent = pred.confidence || "未設定";
      tdConf.appendChild(badge);
      tr.appendChild(tdConf);

      tbody.appendChild(tr);
    });

    checkMultiSelect();
    validateRequiredFields();
  }

  function validateRequiredFields() {
    const selects = document.querySelectorAll('.common-field-select');
    const selectedFields = Array.from(selects).map(s => s.value);
    const requiredFields = serverData.requiredFields || ["出荷日", "届け先名称", "実績運賃"];
    
    const missing = requiredFields.filter(rf => !selectedFields.includes(rf));
    const isCalc = document.getElementById('calcMethod_calc').checked;
    
    const warningDiv = document.getElementById('mapping-validation-warning');
    const btnConfirm = document.getElementById('btn-confirm-mapping');

    if (missing.length > 0 && !isCalc) {
      warningDiv.textContent = "※必須項目（" + missing.join(", ") + "）のマッピングが不足しています。";
      warningDiv.style.display = "block";
      btnConfirm.disabled = true;
    } else {
      warningDiv.style.display = "none";
      btnConfirm.disabled = false;
    }
  }

  function confirmMapping() {
    const selects = document.querySelectorAll('.common-field-select');
    const finalMapping = [];
    
    selects.forEach((sel) => {
      const idx = sel.dataset.originalIndex;
      const val = sel.value;
      const joinOrderInput = document.getElementById(`joinOrder_${idx}`);
      const joinMethodSelect = document.getElementById(`joinMethod_${idx}`);

      finalMapping.push({
        originalIndex: Number(idx),
        originalName: sel.dataset.originalName,
        commonField: val,
        joinGroupId: val ? `JOIN_${val}` : "",
        joinOrder: joinOrderInput ? Number(joinOrderInput.value) : (Number(idx) + 1),
        joinMethod: joinMethodSelect ? joinMethodSelect.value : "半角スペース"
      });
    });

    const isCalc = document.getElementById('calcMethod_calc').checked;
    const calcRuleList = [];
    if (isCalc) {
      finalMapping.forEach(m => {
        const calcFields = ["基本運賃", "中継料", "燃料サーチャージ", "その他加算料金", "値引額", "その他運賃関連項目"];
        if (calcFields.includes(m.commonField)) {
          calcRuleList.push({
            sourceIndex: m.originalIndex,
            operator: calcOperators[m.originalIndex] || "+"
          });
        }
      });
    }

    const cpSelect = document.getElementById('contractProfileSelect');
    const isNewCp = cpSelect.value === "";

    showLoading("標準化処理を実行中...");

    const payload = {
      companyCode: currentSession.companyCode,
      fileName: currentSession.fileName,
      formatSignature: currentSession.formatSignature,
      calcMethod: isCalc ? "計算" : "直接取得",
      calcRule: isCalc ? JSON.stringify({ type: "calc", fields: calcRuleList }) : "",
      contractProfileId: cpSelect.value,
      contractProfileName: isNewCp ? document.getElementById('newContractProfileName').value : "",
      contractIdentifier: isNewCp ? document.getElementById('newContractIdentifier').value : "",
      surchargeHandling: document.getElementById('surchargeHandling').value,
      mapping: finalMapping,
      rawData: currentSession.rawData
    };

    google.script.run
      .withSuccessHandler(res => {
        hideLoading();
        if (!res || !res.success) {
          alert("標準化処理エラー: " + (res ? res.message : "不明なエラー"));
          return;
        }

        document.getElementById('result-message').textContent = res.message || "標準化処理が正常に完了しました。";

        const errDetailsContainer = document.getElementById('error-details-container');
        const errDetailsText = document.getElementById('error-details-text');
        const errCount = (res.errorCount !== undefined) ? res.errorCount : ((res.errorDetails && res.errorDetails.length) || 0);

        if (res.errorDetails && res.errorDetails.length > 0) {
          if (errDetailsContainer) errDetailsContainer.style.display = "block";
          if (errDetailsText) errDetailsText.textContent = res.errorDetails.map((e, i) => `${i+1}.\n${e}`).join('\n\n');
        } else {
          if (errDetailsContainer) errDetailsContainer.style.display = "none";
          if (errDetailsText) errDetailsText.textContent = "";
        }

        const csvBtn = document.getElementById('btn-download-csv');
        const csvNotice = document.getElementById('csv-disabled-notice');
        if (errCount > 0) {
          if (csvBtn) {
            csvBtn.disabled = true;
            csvBtn.style.backgroundColor = "#a0aec0";
            csvBtn.style.cursor = "not-allowed";
          }
          if (csvNotice) csvNotice.style.display = "block";
        } else {
          if (csvBtn) {
            csvBtn.disabled = false;
            csvBtn.style.backgroundColor = "#3182ce";
            csvBtn.style.cursor = "pointer";
          }
          if (csvNotice) csvNotice.style.display = "none";
        }

        goToStep(3);
      })
      .withFailureHandler(err => {
        hideLoading();
        alert("通信エラー: " + err.message);
      })
      .apiSaveMappingAndStandardize(payload);
  }

  function downloadCsv() {
    if (!currentSession || !currentSession.companyCode) {
      alert("対象会社情報が読み取れません。");
      return;
    }
    showLoading("標準化CSVを出力中...");
    google.script.run
      .withSuccessHandler(res => {
        hideLoading();
        if (res && res.contentBase64) {
          try {
            const byteCharacters = atob(res.contentBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", res.filename || "standardized.csv");
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } catch(e) {
            alert("CSVダウンロード処理エラー: " + e.message);
          }
        } else {
          alert("出力対象のCSVデータが存在しません。");
        }
      })
      .withFailureHandler(err => {
        hideLoading();
        alert("CSV出力通信エラー: " + err.message);
      })
      .apiGenerateCsv(currentSession.companyCode, null);
  }
</script>
