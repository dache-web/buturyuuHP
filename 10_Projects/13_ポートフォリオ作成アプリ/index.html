<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LINE風 インタラクティブ・ポートフォリオ</title>
  
  <!-- 🌟 デザイン設定（外部ファイル） -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="app-container">
    <!-- 1. ヘッダー（上部のバー） -->
    <header class="header">
      <div class="header-back">＜</div>
      <div class="header-title" style="flex:1;">My portfolio Instagram</div>
      <!-- 🌟 管理用：編集モードへの切り替えボタン -->
      <button onclick="toggleEditMode()" id="editToggleBtn" style="background:none; border:none; font-size:20px; cursor:pointer; padding:5px;">⚙</button>
    </header>

    <!-- 🌟 管理用：編集中の保存・送信ボタン -->
    <div id="editControls" style="display:none; position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.95); padding:15px; border-top:3px solid #62A49B; text-align:center; z-index:2000; box-shadow:0 -5px 15px rgba(0,0,0,0.1);">
      <p style="font-size:11px; margin:0 0 10px 0; color:#333; font-weight:bold;">📝 編集モード：タップで編集、「追加」「削除」ボタンで調整</p>
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button class="btn-primary" style="margin:5px 0; background:#62A49B; padding:8px 15px; font-size:12px;" onclick="downloadDataJs()">💾 データを保存(data.js)</button>
        <button class="btn-primary" style="margin:5px 0; background:#666; padding:8px 15px; font-size:12px;" onclick="toggleEditMode()">閉じる</button>
        <button class="btn-primary" style="margin:5px 0; background:#f44336; padding:8px 15px; font-size:12px;" onclick="resetPortfolioData()">🔄 初期状態にリセット</button>
      </div>
      <p style="font-size:9px; color:#999; margin-top:5px;">※「データを保存」して、js/data.js に上書きすると永久保存されます。</p>
    </div>

    <!-- 2. トーク画面（中央のメッセージが流れる場所） -->
    <div class="chat-area" id="chatArea">
      <!-- メッセージは js/app.js の initApp() によって動的に生成されます -->
    </div>

    <!-- 3. 下部のリッチメニュー（固定エリア） -->
    <div class="rich-menu-area" id="richMenu">
      <div class="rich-menu-grid">
        <button class="menu-btn bg-white" onclick="handleMenuClick('profile')">
          <span class="menu-icon">👤</span>
          <span>プロフィール</span>
        </button>
        <button class="menu-btn bg-teal" onclick="handleMenuClick('service')">
          <span class="menu-icon">📋</span>
          <span>サービス内容</span>
        </button>
        <button class="menu-btn bg-white" onclick="handleMenuClick('category')">
          <span class="menu-icon">📁</span>
          <span>カテゴリー別実績</span>
        </button>
        
        <button class="menu-btn bg-teal" onclick="handleMenuClick('voice')">
          <span class="menu-icon">💬</span>
          <span>クライアントの声</span>
        </button>
        <button class="menu-btn bg-white" onclick="handleMenuClick('price')">
          <span class="menu-icon">💰</span>
          <span>料金プラン</span>
        </button>
        <button class="menu-btn bg-teal" onclick="handleMenuClick('contact')">
          <span class="menu-icon">📩</span>
          <span>お問い合わせ</span>
        </button>
      </div>
    </div>
    
    <div class="rich-menu-trigger" onclick="toggleRichMenu()" id="menuTriggerBtn">
      メニュー ▼
    </div>
  </div>

  <!-- 画像拡大モーダル -->
  <div id="imageModal" onclick="closeImageModal()">
    <img src="" alt="拡大表示">
    <div style="position:absolute; bottom:30px; color:white; font-size:12px; background:rgba(0,0,0,0.4); padding:10px 20px; border-radius:30px;">
      タップして閉じる
    </div>
  </div>

  <!-- 🌟 プログラム読み込み -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 起動時にウェルカムメッセージを表示
    window.onload = function() {
      if (typeof initApp === 'function') initApp();
    };
  </script>

</body>
</html>
