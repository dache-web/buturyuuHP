<script>
/**
 * クライアントサイド スクリプト
 */

let initialData = null;
let currentProcessId = null;

window.onload = function() {
  initSettings();
  setupDragAndDrop();
};

// 初期データ取得
function initSettings() {
  showLoading('システム状態を確認中...');
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      
      if (!result.success) {
        showDetailedError(result);
        return;
      }

      setupTargetMonths(result.targetMonths);
      setupCompanies(result.companies, result.companyCounts);
    })
    .withFailureHandler(function(error) {
      hideLoading();
      showError(error);
    })
    .getAnalysisScreenInitialData();
}

function showDetailedError(result) {
  let html = '<div class="alert error" style="margin-top: 10px; display:block;">';
  html += '<h4>システム初期化エラー</h4>';
  
  if (result.errorDetails) {
    html += '<p><strong>原因:</strong> ' + result.errorDetails + '</p>';
  }
  
  if (result.settingsErrors && result.settingsErrors.length > 0) {
    html += '<p><strong>設定不備:</strong></p><ul>';
    result.settingsErrors.forEach(e => html += '<li>' + e + '</li>');
    html += '</ul>';
  }
  
  if (result.missingSheets && result.missingSheets.length > 0) {
    html += '<p><strong>シート不足:</strong></p><ul>';
    result.missingSheets.forEach(s => html += '<li>' + s + ' が存在しません。</li>');
    html += '</ul>';
  }
  
  if (result.missingColumns && result.missingColumns.length > 0) {
    html += '<p><strong>必須列不足:</strong></p><ul>';
    result.missingColumns.forEach(c => html += '<li>' + c + ' が見つかりません。</li>');
    html += '</ul>';
  }
  
  html += '<p style="margin-top:10px;">「初期設定」または「テスト環境を作成する」を再実行してください。</p>';
  html += '</div>';
  
  document.getElementById('status-message').innerHTML = html;
  document.getElementById('status-message').style.display = 'block';
  document.getElementById('btnExecute').disabled = true;
}

function setupTargetMonths(months) {
  const tm = document.getElementById('targetMonth');
  const cm = document.getElementById('compareMonth');
  
  tm.innerHTML = '';
  cm.innerHTML = '';
  
  if (months && months.length > 0) {
    months.forEach(m => {
      tm.appendChild(new Option(m, m));
      cm.appendChild(new Option(m, m));
    });
  }
}

function setupCompanies(companies, companyCounts) {
  const container = document.getElementById('company-list');
  container.innerHTML = '';
  
  if (!companies || companies.length === 0) {
    container.innerHTML = '<div class="alert error">分析可能な路線会社を取得できませんでした。<br>01_路線会社マスタと会社別標準化データシートを確認してください。</div>';
    return;
  }
  
  companies.forEach(function(comp) {
    const count = companyCounts && companyCounts[comp.code] !== undefined ? companyCounts[comp.code] : 0;
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = comp.code;
    cb.name = 'companies';
    
    // 初期選択設定
    if (comp.initialSelect) {
      cb.checked = true;
    }
    
    cb.addEventListener('change', updateCompanyCount);
    
    label.appendChild(cb);
    label.appendChild(document.createTextNode(' ' + comp.code + ' ' + comp.name + ' (' + count + '件)'));
    container.appendChild(label);
  });
  
  updateCompanyCount();
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  event.target.classList.add('active');
}

function toggleSelectAll() {
  const isChecked = document.getElementById('selectAll').checked;
  const checkboxes = document.getElementsByName('companyGroup');
  checkboxes.forEach(cb => cb.checked = isChecked);
  updateSelectCount();
}

function updateSelectCount() {
  const checkboxes = document.getElementsByName('companies');
  let checkedCount = 0;
  checkboxes.forEach(cb => {
    if (cb.checked) checkedCount++;
  });
  
  document.getElementById('selectCount').innerText = `選択中: ${checkedCount}社`;
  
  const allChecked = (checkedCount === checkboxes.length && checkboxes.length > 0);
  document.getElementById('selectAll').checked = allChecked;
  
  const tm = document.getElementById('targetMonth').value;
  document.getElementById('btnExecute').disabled = (checkedCount === 0 || !tm);
}

function updateCompanyCount() {
  updateSelectCount();
}

// ==========================================
// ドラッグ＆ドロップ 処理
// ==========================================
function setupDragAndDrop() {
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, preventDefaults, false);
  });
  
  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }
  
  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
  });
  
  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
  });
  
  dropZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files.length > 0) handleFile(files[0]);
  }, false);
  
  fileInput.addEventListener('change', function() {
    if (this.files.length > 0) handleFile(this.files[0]);
  });
}

function handleFile(file) {
  const statusEl = document.getElementById('upload-status');
  statusEl.innerText = '';
  document.getElementById('register-section').style.display = 'none';
  
  if (!file.name.toLowerCase().endsWith('.csv') && !file.name.toLowerCase().endsWith('.xlsx')) {
    statusEl.innerText = 'CSVまたはXLSXファイルを選択してください。';
    statusEl.style.color = 'red';
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    const base64Data = dataUrl.split(',')[1];
    
    showLoading('ファイルを解析中...');
    
    google.script.run
      .withSuccessHandler(function(res) {
        hideLoading();
        if (res.success) {
          statusEl.innerText = `ファイル「${res.fileName}」(${res.totalRows}行) の解析に成功しました。`;
          statusEl.style.color = 'green';
          showRegisterSection(res.processId, res.companies);
        } else {
          statusEl.innerText = res.error;
          statusEl.style.color = 'red';
        }
      })
      .withFailureHandler(function(err) {
        hideLoading();
        statusEl.innerText = '通信エラーが発生しました: ' + err.message;
        statusEl.style.color = 'red';
      })
      .processUpload(base64Data, file.name, file.type);
  };
  
  reader.readAsDataURL(file);
}

function showRegisterSection(processId, companies) {
  currentProcessId = processId;
  const sec = document.getElementById('register-section');
  const ul = document.getElementById('company-list');
  const stat = document.getElementById('register-status');
  
  ul.innerHTML = '';
  stat.innerText = '';
  
  companies.forEach(c => {
    const li = document.createElement('li');
    li.innerHTML = `<strong>${c.name}</strong> (${c.code}) - ${c.count}件 `;
    
    const btn = document.createElement('button');
    btn.innerText = '登録する';
    btn.onclick = function() {
      executeRegister(c.code, btn);
    };
    
    li.appendChild(btn);
    ul.appendChild(li);
  });
  
  sec.style.display = 'block';
}

function executeRegister(companyCode, btn) {
  if (!currentProcessId) return;
  
  btn.disabled = true;
  btn.innerText = '登録中...';
  const stat = document.getElementById('register-status');
  stat.innerText = '';
  
  showLoading('登録処理を実行中...');
  
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res.success) {
        stat.innerText = `登録完了: 新規 ${res.newCount}件 / 重複除外 ${res.dupCount}件 (保存先: ${res.destSheet})`;
        stat.style.color = 'green';
        btn.innerText = '登録完了';
        
        if (res.remainingCount === 0) {
          stat.innerText += '\n全社の登録が完了しました。';
          currentProcessId = null;
        }
      } else {
        stat.innerText = res.error;
        stat.style.color = 'red';
        btn.disabled = false;
        btn.innerText = '登録する';
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      stat.innerText = '通信エラーが発生しました: ' + err.message;
      stat.style.color = 'red';
      btn.disabled = false;
      btn.innerText = '登録する';
    })
    .registerData(currentProcessId, companyCode);
}

// ==========================================
// 分析実行
// ==========================================
function executeAnalysis() {
  const targetMonth = document.getElementById('targetMonth').value;
  const compareMonth = document.getElementById('compareMonth').value;
  
  const checkboxes = document.getElementsByName('companies');
  const selectedCompanies = [];
  checkboxes.forEach(cb => {
    if (cb.checked) selectedCompanies.push(cb.value);
  });
  
  if (selectedCompanies.length === 0) {
    alert('分析対象の路線会社を1社以上選択してください。');
    return;
  }
  
  if (!targetMonth) {
    alert('対象年月を選択してください。');
    return;
  }
  
  const params = {
    targetMonth: targetMonth,
    compareMonth: compareMonth,
    selectedCompanies: selectedCompanies
  };
  
  const statusEl = document.getElementById('execute-status');
  statusEl.innerText = '';
  statusEl.className = 'status-msg';
  
  document.getElementById('btnExecute').disabled = false;
  showLoading('分析を実行しています...');
  
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      document.getElementById('btnExecute').disabled = false;
      if (res.success) {
        statusEl.innerText = `分析完了: 対象 ${res.data.count}件を処理しました。`;
        statusEl.classList.add('success');
      } else {
        statusEl.innerText = `エラー: ${res.error}`;
        statusEl.classList.add('error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      document.getElementById('btnExecute').disabled = false;
      statusEl.innerText = `システムエラー: ${err.message}`;
      statusEl.classList.add('error');
    })
    .executeAnalysis(params);
}

// ==========================================
// ユーティリティ
// ==========================================
function showError(error) {
  alert('初期化エラー: ' + error.message);
}

function showLoading(text) {
  document.getElementById('loading-text').innerText = text || '処理中...';
  document.getElementById('loading').style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}
</script>
