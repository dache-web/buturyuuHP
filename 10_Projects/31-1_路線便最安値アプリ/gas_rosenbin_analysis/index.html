<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('style'); ?>
  </head>
  <body>
    <div class="container">
      <div id="header">
        <h2>路線便運賃分析</h2>
        <p class="subtitle">標準化データの取込と分析を行います。</p>
      </div>
      
      <!-- メインタブ -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-import')">データ取込</button>
        <button class="tab-btn" onclick="switchTab('tab-analysis')">分析実行</button>
      </div>

      <!-- データ取込タブ -->
      <div id="tab-import" class="tab-content active">
        <div class="card">
          <h3>ファイルの取込 (Excel/CSV)</h3>
          <p class="desc">アプリ1で作成した「会社別標準化データ」を取り込みます。</p>
          <div id="drop-zone" class="drop-zone">
            ここにファイルをドロップ<br>
            または<br>
            <button onclick="document.getElementById('file-input').click()">ファイルを選択</button>
            <input type="file" id="file-input" style="display:none;" accept=".csv, .xlsx">
          </div>
          <div id="upload-status" class="status-msg"></div>
          
          <!-- 第2段階：会社別登録画面（非表示） -->
          <div id="register-section" style="display:none; margin-top: 20px;">
            <h4>解析結果</h4>
            <p>以下の会社のデータが見つかりました。登録する会社を選択してください。</p>
            <ul id="company-list" class="company-list"></ul>
            <div id="register-status" class="status-msg"></div>
          </div>
        </div>
      </div>

      <!-- 分析実行タブ -->
      <div id="tab-analysis" class="tab-content">
        <div class="card">
          <h3>分析条件</h3>
          
          <div class="form-group">
            <label>対象年月</label>
            <select id="targetMonth" class="form-control" onchange="updateCompanyCounts()">
              <option value="">読込中...</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>比較年月（任意）</label>
            <select id="compareMonth" class="form-control">
              <option value="">設定しない</option>
            </select>
          </div>
        </div>
        
        <div class="card">
          <h3>対象路線会社</h3>
          <div class="list-header">
            <label>
              <input type="checkbox" id="selectAll" checked onchange="toggleSelectAll()">
              すべて選択
            </label>
            <span id="selectCount">選択中: 0社</span>
          </div>
          <div id="companyCheckboxes" class="checkbox-list">
            読み込み中...
          </div>
        </div>

        <button id="btnExecute" class="btn btn-primary btn-block" onclick="executeAnalysis()">分析を実行する</button>
        <div id="execute-status" class="status-msg" style="margin-top:15px; text-align:center;"></div>
      </div>
      
    </div>
    
    <!-- ローディングオーバーレイ -->
    <div id="loading" class="loading-overlay" style="display:none;">
      <div class="spinner"></div>
      <div id="loading-text" class="loading-text">処理中...</div>
    </div>
    
    <?!= include('script'); ?>
  </body>
</html>
